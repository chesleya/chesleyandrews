<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Sip &amp; Swap</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Matched to the invite graphic: blush, navy, tomato. Light only, like the paper. */
  :root{
    --bg:#f7d9d1; --ink:#1f2a85; --muted:#5b5f93; --line:#1f2a85;
    --accent:#d9412b; --accent-ink:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:32px 16px 80px}
  h1{font-family:"Libre Caslon Display",Georgia,serif;font-weight:400;letter-spacing:-.01em}
  h2{font-family:"DM Sans",system-ui,sans-serif;letter-spacing:-.01em}
  h1{font-weight:400}
  h1 .sip{display:block;font-weight:400;font-size:.42em;letter-spacing:0;margin-bottom:-.05em}
  h1 .sip em{color:inherit;font-style:normal}
  h2{font-size:22px;font-weight:600;margin:0 0 16px}
  h2 em{color:var(--accent);font-style:normal}
  .eyebrow,.label{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:700}
  .eyebrow{padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:24px}
  .topline{display:flex;justify-content:space-between;gap:12px;text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:700;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:28px}
  .masthead h1,#gate h1{font-size:clamp(44px,15.5vw,104px);line-height:1;margin:0 0 22px;letter-spacing:-.02em;white-space:nowrap}
  .masthead h1 .sip,#gate h1 .sip{display:inline;font-style:normal;font-size:1em;font-weight:400;letter-spacing:-.02em;margin:0}
  .pill{display:inline-block;text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:7px 14px}
  .details{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:32px;font-size:17px;line-height:1.45}
  .about{margin-top:28px;font-size:17px;line-height:1.6;white-space:pre-line}
  .details .label{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:700;margin-bottom:6px}
  .details a{color:inherit;text-decoration:none}
  @media (max-width:420px){.details{grid-template-columns:1fr}}
  .hero{width:100%;border-radius:12px;display:block;cursor:zoom-in}
  .meta{margin-top:20px}
  .meta b{font-weight:600}
  .meta a{color:inherit;text-decoration:none}
  .muted{color:var(--muted)}
  .card{border-top:1px solid var(--line);margin-top:36px;padding-top:28px}
  #photoCard h2{font-size:16px;margin-bottom:12px}
  label{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
  input,select{width:100%;font:inherit;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink)}
  input::placeholder{color:var(--muted);opacity:1}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
  button,.btn{font:inherit;font-weight:600;cursor:pointer;border-radius:999px;padding:11px 20px;border:1px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
  .primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);margin-top:4px}
  .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  .choice[aria-pressed="true"]{background:var(--ink);color:#fff}
  #choices.arming{pointer-events:none}
  .cal{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:20px}
  .linkish{display:inline;background:none;border:none;border-radius:0;padding:0;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
  .err{color:var(--accent);font-size:14px;min-height:1.4em;margin-top:8px}
  .photos{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -16px;padding:0 16px;scroll-padding:0 16px}
  .photos::-webkit-scrollbar{display:none}
  .photos img{flex:0 0 auto;height:280px;width:auto;max-width:88vw;object-fit:cover;border-radius:8px;display:block;scroll-snap-align:start;cursor:zoom-in;background:rgba(31,42,133,.06)}
  .dots{display:flex;justify-content:center;gap:6px;margin-top:14px}
  .dots span{width:6px;height:6px;border-radius:50%;background:rgba(31,42,133,.25)}
  .dots span.on{background:var(--ink)}
  .group{margin-top:24px}
  .group .label{margin-bottom:6px}
  .names{display:flex;flex-direction:column}
  .chip{padding:4px 0}
  .chip.me{font-weight:inherit}
  #matches{margin-top:6px;border-radius:8px;overflow:hidden}
  #matches button{display:block;width:100%;text-align:left;border:none;border-radius:0;border-bottom:1px solid rgba(31,42,133,.15);background:#fdf3f0;padding:13px 14px;font-weight:500}
  #matches button:last-child{border-bottom:none}
  #matches .none{font-size:14px;color:var(--muted);padding:8px 2px}
  .hidden{display:none!important}
  dialog{border:none;padding:0;background:transparent;max-width:min(92vw,900px)}
  dialog::backdrop{background:rgba(0,0,0,.8)}
  dialog img{max-width:100%;max-height:85vh;border-radius:10px;display:block}
  .note{font-size:13px;margin-top:16px}
  @media (max-width:520px){
    .wrap{padding:20px 16px 64px}
    .card{margin-top:28px;padding-top:24px}
    h2{font-size:21px}
    .photos img{height:240px}
    #choices{display:grid;grid-template-columns:1fr;gap:8px}
    #choices button,#gcal,.primary{width:100%;justify-content:center;padding:14px 20px}
    .cal{flex-direction:column;align-items:stretch;text-align:center}
    .cal .linkish{align-self:center;padding:6px 0}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== Step 1: password ===== -->
  <section id="gate">
    <h1 style="margin-top:12px" class="ttl">Sip &amp; Swap</h1>
    <div class="card" style="border-top:none;margin-top:24px;padding-top:0">
      <form id="pwForm">
        <label for="pw">Password <span style="font-weight:400">(from the email)</span></label>
        <input id="pw" type="password" autocomplete="off" required>
        <div class="err" id="pwErr"></div>
        <button class="primary" type="submit">Submit</button>
      </form>
    </div>
  </section>

  <!-- ===== Step 2: the invite ===== -->
  <section id="invite" class="hidden">
    <header class="masthead">
      <h1 class="ttl" style="margin-top:12px">Sip &amp; Swap</h1>
      <div class="details">
        <div><div class="label">When</div><div id="when"></div></div>
        <div><div class="label">Where</div><div id="loc"></div><a id="addr" target="_blank" rel="noopener"></a></div>
      </div>
      <div class="about" id="about"></div>
    </header>

    <div class="card hidden" id="photoCard">
      <h2 data-f="photosTitle"></h2>
      <div class="photos" id="photos"></div>
      <div class="dots" id="dots"></div>
    </div>

    <div class="card">
      <h2 id="greet">RSVP</h2>
      <div id="pickWrap" style="margin-bottom:4px">
        <input id="name" type="text" placeholder="Find your name" aria-label="Find your name" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
        <div id="matches" role="listbox"></div>
      </div>
      <div class="row" id="choices">
        <button class="choice" data-s="yes" aria-pressed="false">I'll be there</button>
        <button class="choice" data-s="maybe" aria-pressed="false">Maybe</button>
        <button class="choice" data-s="no" aria-pressed="false">Next time</button>
      </div>
      <p class="note" style="margin-top:12px" id="notMeLine"><button class="linkish" id="notMe">Not <span id="me2"></span>?</button></p>
      <div class="err" id="rsvpErr"></div>
      <div class="cal">
        <a class="btn" id="gcal" target="_blank" rel="noopener">Add to Google Calendar</a>
        <button class="linkish" id="ics">or Apple Calendar</button>
      </div>
    </div>

    <div class="card">
      <h2>Who's coming</h2>
      <div id="groups"></div>
    </div>
  </section>

</div>
<dialog id="lightbox"><img alt=""></dialog>

<script>
/* ==========================================================
   EDIT THIS BLOCK FOR EACH PARTY
   ========================================================== */
const CONFIG = {
  eyebrow:   "You're invited",
  place:     "",
  title:     "Sip & Swap",
  about:     "Join us for an evening of sustainable style and the best vibes!\n\nBring any women’s and kids’ clothes, costumes & accessories you’re ready to part with and shop the swap. No rules on how much to bring or take, but we promise you’ll find something to love! Drinks and light bites served.\n\nWe’ll have straight-to-donate and textile recycling bins on site too. Leftovers go to the next swap, local organizations, and our caregivers.\n\nWe do this seasonally. Let us know if you’d ever like to host!",   // fallback; edit it on the host page
  blurb:     "Women's & children's clothing. Bring what you've stopped wearing. Leave with what you'll start.",
  // Date, time, place and address live in the Google script and arrive only after the password.
  photosTitle: "Snagged at the swap",
  photos:    ["01","02","03","04","05","06","07","08"].map(n=>`photos/${n}.svg?v=2`),  // bump v when photos change so phones don't show old copies
  api:       "https://script.google.com/macros/s/AKfycbynn-BS2PBlOKkPP1lHHlGK5c565JmP9rseB78u1pRWhaQeFmWtCjkVi7WTx6YP70xC/exec"
};
/* ========================================================== */

const $ = s => document.querySelector(s);
const DEMO = !/^https:\/\/script\.google\.com\//.test(CONFIG.api);
const store = {
  get:k=>{try{return localStorage.getItem("sns_"+k)}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem("sns_"+k,v)}catch(e){}},
  del:k=>{try{localStorage.removeItem("sns_"+k)}catch(e){}}
};
let TITLE = store.get("title") || CONFIG.title, SHOW_PHOTOS = false, ABOUT = CONFIG.about;
let EV = {}, PW = store.get("pw") || "", ME = store.get("me") || "", GUESTS = [];

/* ---------- API ---------- */
const demoGuests = ["Alex","Bea","Cass","Dana","Eli","Fran"].map((n,i)=>({name:n,status:["yes","yes","maybe","","no",""][i]}));
async function api(body){
  if (DEMO){
    if (body.action === "meta") return {title: CONFIG.title};
    if (body.pw !== "demo") return {error:"bad_password"};
    if (body.action === "rsvp"){ const g = demoGuests.find(g=>g.name===body.name); if(g){ g.status = body.status; g.friend = body.status==="no" ? "" : (body.friend ?? g.friend ?? ""); } }
    return {guests: demoGuests.map(g=>({...g})), title: CONFIG.title, showPhotos: true, event: {date:"2030-01-04", start:"18:00", end:"20:00", timeZone:"America/New_York", location:"Sample house", address:"1 Sample Lane, Anytown, NY 10000"}};
  }
  const r = await fetch(CONFIG.api, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body)});
  return r.json();
}

/* ---------- Flow ---------- */
function show(id){ for (const s of ["gate","invite"]) $("#"+s).classList.toggle("hidden", s!==id); document.querySelectorAll(".ttl").forEach(fitTitle); }

async function enter(pw){
  const res = await api({action:"list", pw});
  if (res.error) return false;
  PW = pw; store.set("pw", pw); GUESTS = res.guests; EV = res.event || {};
  SHOW_PHOTOS = !!res.showPhotos; if (res.title) setTitle(res.title); if (typeof res.about === "string") ABOUT = res.about;
  if (ME && !GUESTS.some(g=>g.name===ME)){ ME = ""; store.del("me"); }
  renderInvite(); window.scrollTo(0,0);
  return true;
}

function fillNames(){ $("#name").value = ""; $("#matches").innerHTML = ""; }

let PICKED_AT = 0;
function choose(name){
  PICKED_AT = Date.now();
  const c = $("#choices"); c.classList.add("arming");
  setTimeout(()=>c.classList.remove("arming"), 700);
  $("#name").blur();
  ME = name; store.set("me", ME); $("#rsvpErr").textContent = ""; renderInvite();
}
function findMatches(q){
  q = q.trim().toLowerCase();
  if (!q) return [];
  return GUESTS.map(g=>g.name).filter(n => n.toLowerCase().split(/\s+/).some(w=>w.startsWith(q)) || n.toLowerCase().startsWith(q)).sort().slice(0,6);
}
$("#name").addEventListener("input", () => {
  const box = $("#matches"); box.innerHTML = "";
  const q = $("#name").value; if (!q.trim()) return;
  const m = findMatches(q);
  if (!m.length){ const d = document.createElement("div"); d.className = "none"; d.textContent = "No match yet. Try your first name."; box.appendChild(d); return; }
  m.forEach(n=>{ const b = document.createElement("button"); b.type = "button"; b.textContent = n;
    // touchend + preventDefault swallows the follow-up click, so the tap can't land on a reply button after the list closes
    b.addEventListener("touchend", e => { e.preventDefault(); choose(n); });
    b.onclick = () => choose(n);
    box.appendChild(b); });
});
$("#name").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const m = findMatches($("#name").value); if (m.length === 1) choose(m[0]);
});

$("#pwForm").onsubmit = async e => {
  e.preventDefault(); $("#pwErr").textContent = "";
  const ok = await enter($("#pw").value.trim()).catch(()=>null);
  if (ok === null) $("#pwErr").textContent = "Couldn't reach the guest list. Try again in a minute.";
  else if (!ok) $("#pwErr").textContent = "Not quite. Check the email.";
};

$("#notMe").onclick = () => { ME = ""; store.del("me"); renderInvite(); $("#name").focus(); };

async function save(status, friend){
  $("#rsvpErr").textContent = "";
  const res = await api({action:"rsvp", pw:PW, name:ME, status, friend}).catch(()=>({error:"net"}));
  if (res.error){ $("#rsvpErr").textContent = "That didn't save. Try again?"; return false; }
  GUESTS = res.guests; if (res.event) EV = res.event; renderInvite(); return true;
}
const myGuest = () => GUESTS.find(g=>g.name===ME) || {};
// A reply counts only if the press began on that same button.
// iOS "ghost" clicks after the name list closes have no press of their own on the button, so they're ignored.
let PRESSED = null;
$("#choices").addEventListener("pointerdown", e => { PRESSED = e.target.closest(".choice"); });
document.addEventListener("pointerdown", e => { if (!e.target.closest("#choices")) PRESSED = null; }, true);
$("#choices").onclick = async e => {
  const b = e.target.closest(".choice"); if (!b) return;
  if (PRESSED !== b) return;
  PRESSED = null;
  if (Date.now() - PICKED_AT < 800) return;
  $("#rsvpErr").textContent = "";
  if (!ME){ $("#rsvpErr").textContent = "Pick your name first, then reply."; $("#name").focus(); return; }
  await save(b.dataset.s, "");
};

/* ---------- Render ---------- */
function fill(){ document.querySelectorAll("[data-f]").forEach(el=>el.textContent = CONFIG[el.dataset.f] || ""); setTitle(TITLE); }
function setTitle(t){
  TITLE = t; store.set("title", t); document.title = t;
  document.querySelectorAll(".ttl").forEach(el=>{ el.textContent = t; fitTitle(el); });
}
// Keep the title on one line: shrink it until it fits, and only wrap if it's very long.
function fitTitle(el){
  if (!el.offsetParent) return;
  el.style.fontSize = ""; el.style.whiteSpace = "nowrap";
  let size = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth && size > 36){ size -= 2; el.style.fontSize = size + "px"; }
  if (el.scrollWidth > el.clientWidth) el.style.whiteSpace = "normal";
}
window.addEventListener("resize", ()=>document.querySelectorAll(".ttl").forEach(fitTitle));

function fmtWhen(){
  if (!EV.date) return "";
  const s = new Date(`${EV.date}T${EV.start}:00`), e = new Date(`${EV.date}T${EV.end}:00`);
  const d = s.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  const t = x => x.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}).replace(":00","");
  return `${d}\n${t(s).toLowerCase()}`;
}

function renderInvite(){
  fill();
  $("#when").textContent = fmtWhen(); $("#when").style.whiteSpace = "pre-line";
  $("#loc").textContent = EV.location || "";
  $("#about").textContent = ABOUT || ""; $("#about").classList.toggle("hidden", !ABOUT);
  $("#addr").textContent = (EV.address || "").replace(/, (?=[^,]+, [A-Z]{2})/, ",\n");
  $("#addr").style.whiteSpace = "pre-line";
  $("#addr").href = "https://maps.google.com/?q=" + encodeURIComponent(EV.address || "");
  const first = ME.split(" ")[0];
  $("#greet").textContent = "RSVP";
  $("#me2").textContent = first;
  $("#pickWrap").classList.toggle("hidden", !!ME);
  $("#notMeLine").classList.toggle("hidden", !ME);
  if (!ME) fillNames();

  const mine = (GUESTS.find(g=>g.name===ME)||{}).status || "";
  document.querySelectorAll(".choice").forEach(b=>b.setAttribute("aria-pressed", b.dataset.s===mine));

  $("#gcal").href = gcalLink();

  $("#photoCard").classList.toggle("hidden", !(SHOW_PHOTOS && CONFIG.photos.length));
  if (SHOW_PHOTOS && CONFIG.photos.length){
    $("#photoCard").classList.remove("hidden");
    $("#photos").innerHTML = "";
    CONFIG.photos.forEach(src=>{ const i = new Image(); i.src = src; i.alt = ""; i.loading = "lazy"; i.onclick = ()=>{ $("#lightbox img").src = src; $("#lightbox").showModal(); }; $("#photos").appendChild(i); });
    const dots = $("#dots"); dots.innerHTML = "";
    CONFIG.photos.forEach(()=>dots.appendChild(document.createElement("span")));
    const mark = () => { const box = $("#photos"), imgs = box.querySelectorAll("img"); if(!imgs.length) return;
      let i = 0; imgs.forEach((im,k)=>{ if (im.offsetLeft - box.offsetLeft - 16 <= box.scrollLeft + 4) i = k; });
      if (box.scrollLeft + box.clientWidth >= box.scrollWidth - 4) i = imgs.length - 1;
      dots.querySelectorAll("span").forEach((d,k)=>d.classList.toggle("on",k===i)); };
    $("#photos").onscroll = mark; $("#photos").querySelectorAll("img").forEach(im=>im.onload=mark); mark();
  }

  const groups = [["yes","Coming"],["maybe","Maybe"],["","Haven't replied"],["no","Next time"]];
  const box = $("#groups"); box.innerHTML = "";
  for (const [s,label] of groups){
    const list = GUESTS.filter(g=>(g.status||"")===s).sort((a,b)=>a.name.localeCompare(b.name));
    if (!list.length) continue;
    const g = document.createElement("div"); g.className = "group";
    const h = document.createElement("div"); h.className = "label"; h.textContent = `${label} (${list.length})`;
    const n = document.createElement("div"); n.className = "names";
    list.forEach(x=>{ const c = document.createElement("span"); c.className = "chip" + (x.name===ME?" me":""); c.textContent = x.name;
      n.appendChild(c); });
    g.append(h,n); box.appendChild(g);
  }
  show("invite");
}
$("#lightbox").onclick = () => $("#lightbox").close();

/* ---------- Calendar ---------- */
const stamp = t => EV.date.replace(/-/g,"") + "T" + t.replace(":","") + "00";
function details(){ return `Invite: ${location.href.split("#")[0]}`; }
function where(){ return [EV.location, EV.address].filter(Boolean).join(", "); }
function gcalLink(){
  const p = new URLSearchParams({action:"TEMPLATE", text:TITLE, dates:`${stamp(EV.start)}/${stamp(EV.end)}`, ctz:EV.timeZone, details:details(), location:where()});
  return "https://calendar.google.com/calendar/render?" + p;
}
$("#ics").onclick = () => {
  const esc = s => s.replace(/[\\,;]/g, m=>"\\"+m).replace(/\n/g,"\\n");
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//sipnswap//EN","BEGIN:VEVENT",
    `UID:${EV.date}-sipnswap@invite`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").split(".")[0]}Z`,
    `DTSTART;TZID=${EV.timeZone}:${stamp(EV.start)}`, `DTEND;TZID=${EV.timeZone}:${stamp(EV.end)}`,
    `SUMMARY:${esc(TITLE)}`, `LOCATION:${esc(where())}`, `DESCRIPTION:${esc(details())}`,
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  a.download = "sip-n-swap.ics"; a.click();
};

/* ---------- Start ---------- */
fill();
api({action:"meta"}).then(r=>{ if (r && r.title) setTitle(r.title); }).catch(()=>{});
if (document.fonts) document.fonts.ready.then(()=>document.querySelectorAll(".ttl").forEach(fitTitle));
if (DEMO) $("#pwErr").textContent = "Demo mode — the password is: demo";
if (PW) enter(PW).then(ok=>{ if(!ok){ store.del("pw"); show("gate"); } }).catch(()=>show("gate"));
</script>
</body>
</html>
